# ─────────────────────────────────────────────────────────────────────────────
# Orion IDE — Production Docker Compose (HTTPS edge)
# ─────────────────────────────────────────────────────────────────────────────
# Requires TLS certs in infrastructure/nginx/certs/ (see nginx/certs/README.md).
# For local/docker without TLS, use the root docker-compose.yml instead.
#
#   docker compose -f infrastructure/docker-compose.prod.yml up --build -d
# ─────────────────────────────────────────────────────────────────────────────

services:
  nginx:
    image: nginx:alpine
    container_name: orion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: orion-redis
    restart: unless-stopped
    env_file: [../.env]
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf
      --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    env_file: [../.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orion}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-orion} -d $${POSTGRES_DB:-orion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: orion-api-gateway
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      ENTITLEMENTS_FAIL_OPEN: ${ENTITLEMENTS_FAIL_OPEN:-false}
      ENABLE_AGENTS_ON_FREE: "true"
      ENABLE_DEBUGGER_API: "true"
      ENABLE_DEBUGGER_ON_FREE: "true"
      AUTH_SERVICE_URL: http://auth-service:3001
      DRIVE_SERVICE_URL: http://drive-service:3002
      EDITOR_SERVICE_URL: http://editor-service:3003
      EXECUTION_SERVICE_URL: http://execution-service:3004
      AGENT_SERVICE_URL: http://agent-service:3005
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      TERMINAL_SERVICE_URL: http://terminal-service:3007
      PISTON_API_URL: http://piston:2000/api/v2
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      terminal-service:
        condition: service_started
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  auth-service:
    build:
      context: ..
      dockerfile: services/auth-service/Dockerfile
    container_name: orion-auth-service
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      DATABASE_URL: postgres://${POSTGRES_USER:-orion}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-orion}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-https://localhost/api/auth/google/callback}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  drive-service:
    build:
      context: ..
      dockerfile: services/drive-service/Dockerfile
    container_name: orion-drive-service
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  editor-service:
    build:
      context: ..
      dockerfile: services/editor-service/Dockerfile
    container_name: orion-editor-service
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3003
      ENABLE_DEBUGGER_API: "true"
      TERMINAL_WORKSPACE_ROOT: /workspace
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - terminal-workspaces:/workspace
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  execution-service:
    build:
      context: ..
      dockerfile: services/execution-service/Dockerfile
    container_name: orion-execution-service
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3004
      PISTON_API_URL: http://piston:2000/api/v2
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      piston:
        condition: service_started
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  agent-service:
    build:
      context: ..
      dockerfile: services/agent-service/Dockerfile
    container_name: orion-agent-service
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3005
      DRIVE_SERVICE_URL: http://drive-service:3002
      EXECUTION_SERVICE_URL: http://execution-service:3004
      NOTIFICATION_SERVICE_URL: http://notification-service:3006
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: orion-notification-service
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3006
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  terminal-service:
    build:
      context: ..
      dockerfile: services/terminal-service/Dockerfile
    container_name: orion-terminal-service
    restart: unless-stopped
    env_file: [../.env]
    environment:
      NODE_ENV: production
      PORT: 3007
      TERMINAL_WORKSPACE_ROOT: /workspace
      DRIVE_SERVICE_URL: http://drive-service:3002
      AUTH_SERVICE_URL: http://auth-service:3001
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - terminal-workspaces:/workspace
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      - drive-service
      - auth-service
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: orion-frontend
    restart: unless-stopped
    depends_on:
      - api-gateway
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  piston:
    image: ghcr.io/engineer-man/piston
    container_name: orion-piston
    restart: unless-stopped
    privileged: true
    tmpfs:
      - /piston/jobs:exec,size=256m
    environment:
      OUTPUT_MAX_SIZE: "65536"
      MAX_PROCESS_COUNT: "64"
      RUN_TIMEOUT: "15000"
      COMPILE_TIMEOUT: "15000"
    volumes:
      - piston-packages:/piston/packages
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

networks:
  orion-network:
    name: orion-network
    driver: bridge

volumes:
  redis-data:
    name: orion-redis-data
  postgres-data:
    name: orion-postgres-data
  piston-packages:
    name: orion-piston-packages
  terminal-workspaces:
    name: orion-terminal-workspaces
