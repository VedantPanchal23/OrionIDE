# ─────────────────────────────────────────────────────────────────────────────
# Orion IDE — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# - No exposed ports except 80/443 on nginx reverse proxy
# - restart: unless-stopped on all services
# - Health checks on all services
# - Resource limits (memory, cpu)
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:
  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: orion-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

  # ── Redis ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: orion-redis
    restart: unless-stopped
    env_file:
      - ../.env
    command: >
      sh -c 'redis-server /usr/local/etc/redis/redis.conf
      --requirepass "$${REDIS_PASSWORD}"'
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Postgres ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: orion-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-orion}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-orion} -d $${POSTGRES_DB:-orion}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ── API Gateway ─────────────────────────────────────────────────────────
  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    container_name: orion-api-gateway
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TERMINAL_SERVICE_URL=http://terminal-service:3007
      - PISTON_API_URL=http://piston:2000/api/v2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - redis
      - terminal-service
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Auth Service ────────────────────────────────────────────────────────
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: orion-auth-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - redis
      - postgres
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Drive Service ───────────────────────────────────────────────────────
  drive-service:
    build:
      context: ../services/drive-service
      dockerfile: Dockerfile
    container_name: orion-drive-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3002
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Editor Service ──────────────────────────────────────────────────────
  editor-service:
    build:
      context: ../services/editor-service
      dockerfile: Dockerfile
    container_name: orion-editor-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3003
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Execution Service ──────────────────────────────────────────────────
  execution-service:
    build:
      context: ../services/execution-service
      dockerfile: Dockerfile
    container_name: orion-execution-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3004
      - PISTON_API_URL=http://piston:2000/api/v2
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Agent Service ──────────────────────────────────────────────────────
  agent-service:
    build:
      context: ../services/agent-service
      dockerfile: Dockerfile
    container_name: orion-agent-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3005
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Notification Service ───────────────────────────────────────────────
  notification-service:
    build:
      context: ../services/notification-service
      dockerfile: Dockerfile
    container_name: orion-notification-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3006
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - redis
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Terminal Service ──────────────────────────────────────────────────
  terminal-service:
    build:
      context: ../services/terminal-service
      dockerfile: Dockerfile
    container_name: orion-terminal-service
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - PORT=3007
      - TERMINAL_WORKSPACE_ROOT=/workspace
      - DRIVE_SERVICE_URL=http://drive-service:3002
    volumes:
      - terminal-workspaces:/workspace
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3007/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      - drive-service
    networks:
      - orion-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: orion-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ── Piston (Code Execution Sandbox) ─────────────────────────────────────
  piston:
    image: ghcr.io/engineer-man/piston
    container_name: orion-piston
    restart: unless-stopped
    tmpfs:
      - /piston/jobs:exec,size=256m
    environment:
      - OUTPUT_MAX_SIZE=65536
      - MAX_PROCESS_COUNT=64
      - RUN_TIMEOUT=15000
    volumes:
      - piston-packages:/piston/packages
    networks:
      - orion-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M

# ── Networks ──────────────────────────────────────────────────────────────
networks:
  orion-network:
    name: orion-network
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────
volumes:
  redis-data:
    name: orion-redis-data
  postgres-data:
    name: orion-postgres-data
  piston-packages:
    name: orion-piston-packages
  terminal-workspaces:
    name: orion-terminal-workspaces
