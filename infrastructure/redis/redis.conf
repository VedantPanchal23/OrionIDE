# Orion IDE — Redis Configuration
# Session storage, write buffers, Google token cache, pub/sub

bind 0.0.0.0
port 6379
protected-mode yes

# Password is set via docker-compose:
#   command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
# Clients must use: REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379

maxmemory 256mb
maxmemory-policy allkeys-lru

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

loglevel notice
